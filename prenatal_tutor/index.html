*{box-sizing:border-box}body{margin:0;font:16px/1.65 'Segoe UI',sans-serif;color:#3e2c3d}.panel{display:grid;grid-template-columns:minmax(150px,220px) minmax(0,1fr);gap:10px 22px;background:linear-gradient(135deg,#fffafc,#f9eaf2);border:1px solid #d9b8ce;border-radius:24px;padding:24px}header{display:contents}header>div,#text,progress,#status,#retry{grid-column:2}#avatar{grid-column:1;grid-row:1/6;align-self:center;background:radial-gradient(ellipse,#f6e0eb,transparent 70%);border:0;border-radius:24px;width:100%;padding:0;cursor:pointer}svg{display:block;width:100%;height:auto;max-height:360px;overflow:visible}.arm-left{transform-origin:62px 126px}.arm-right{transform-origin:116px 126px}.talking .arm-left{animation:explain-left 3.8s ease-in-out infinite}.talking .arm-right{animation:explain-right 4.7s ease-in-out infinite}.mouth{transform-origin:90px 78px;transform:scaleY(.25)}.talking .mouth{animation:speaking .26s ease-in-out infinite alternate}.head{transform-origin:90px 106px}.talking .head{animation:nod 5s ease-in-out infinite}.eyes{transform-origin:90px 66px;animation:blink 5.6s infinite}.avatar-body{transform-origin:90px 320px;animation:breathe 5s ease-in-out infinite}@keyframes speaking{0%{transform:scaleY(.25)}45%{transform:scaleY(.85)}100%{transform:scaleY(.45)}}@keyframes explain-left{0%,100%{transform:rotate(0)}40%,60%{transform:rotate(16deg)}}@keyframes explain-right{0%,100%{transform:rotate(0)}35%,65%{transform:rotate(-19deg)}}@keyframes nod{0%,100%{transform:rotate(0)}40%{transform:rotate(-2deg)}75%{transform:rotate(1deg)}}@keyframes blink{0%,43%,47%,100%{transform:scaleY(1)}45%{transform:scaleY(.1)}}@keyframes breathe{50%{transform:translateY(-2px)}}h2{font-size:1.3rem;line-height:1.4;margin:6px 0}small{color:#7d4568;font-weight:650;letter-spacing:.6px}#text{white-space:pre-line;background:#fff;border-left:4px solid #b8548b;border-radius:14px;padding:18px;margin:0}#status{color:#6a4c62;font-size:13px}progress{width:100%;accent-color:#b8548b;height:9px}#avatar:focus-visible,#retry:focus-visible{outline:3px solid #97416f;outline-offset:3px}#retry{justify-self:start;padding:9px 14px;border:1px solid #c594b0;border-radius:10px;background:#fff6fb;color:#783858;cursor:pointer}#retry[hidden]{display:none}.panel.compact{display:block;padding:4px 0;background:transparent;border:0;border-radius:0}.compact header,.compact #text,.compact progress{display:none}
